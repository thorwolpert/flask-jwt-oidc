[project]
name = "flask-jwt-oidc"
version = "0.9.0"
description = "Opinionated flask oidc client"
authors = [
   {name = "thor wolpert", email = "thor@wolpert.ca"}
]
license = {text = "BSD 3-Clause"}
readme = "README.md"
requires-python = ">=3.9.2,<4"
dependencies = [
    "Flask>=3.1.3",
    "cachelib>=0.13.0",
    "pyjwt>=2.12.1",
    "cryptography>=44.0.0",
]
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
keywords = ["flask", "jwt", "oidc", "authentication"]

[project.urls]
Homepage = "https://github.com/thorwolpert/flask-jwt-oidc"
Issues = "https://github.com/thorwolpert/flask-jwt-oidc/issues"

[tool.poetry]
packages = [{include = "flask_jwt_oidc", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
python-dotenv = "^1.2.0"
Flask-Cors = "^6.0.0"
black = "^25.1.0"
zimports = "^0.7.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
